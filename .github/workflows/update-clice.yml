name: update-clice

on:
  schedule:
    # Every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

# Minimal permission required: push commits back to the repo
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update clice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FILE="lua/mason-custom/packages/clice.lua"

          # Clice publishes nightly builds as prereleases, so /releases/latest
          # always returns 404. Releases are newest-first; select the newest
          # non-draft tag with the expected version format instead.
          LATEST_TAG="$(gh api 'repos/clice-io/clice/releases?per_page=100' --jq '[.[] | select(.draft == false and (.tag_name | test("^v0\\.1\\.[0-9]+$"))) | .tag_name][0] // empty')"

          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No release found for clice-io/clice"
            exit 1
          fi

          echo "Latest release tag: $LATEST_TAG"

          # Accept only v0.1.<digits> tags
          if ! [[ "$LATEST_TAG" =~ ^v0\.1\.[0-9]+$ ]]; then
            echo "::warning::Tag '$LATEST_TAG' does not match v0.1.<digits>, skipping"
            exit 0
          fi

          # Extract the current version pinned in the package spec.
          # grep -m1 avoids a | head pipe (SIGPIPE under pipefail).
          # || true prevents set -e from exiting on grep "no match" (exit 1)
          # before the empty-check below can print a useful error.
          CURRENT_TAG="$(grep -oP -m1 'pkg:github/clice-io/clice@\Kv0\.1\.[0-9]+' "$FILE" || true)"

          if [ -z "$CURRENT_TAG" ]; then
            echo "::error::Could not extract current clice version from $FILE"
            exit 1
          fi

          echo "Current tag: $CURRENT_TAG"

          # Skip if already up to date (no empty commit)
          if [ "$LATEST_TAG" = "$CURRENT_TAG" ]; then
            echo "Already up to date, nothing to commit"
            exit 0
          fi

          echo "Updating $CURRENT_TAG -> $LATEST_TAG"

          python3 - "$FILE" "$LATEST_TAG" <<'PY'
          import re
          import sys

          path, latest_tag = sys.argv[1:]
          source = open(path, encoding="utf-8").read()
          updated, count = re.subn(
              r"pkg:github/clice-io/clice@v0\.1\.\d+",
              f"pkg:github/clice-io/clice@{latest_tag}",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Expected one clice pin replacement, got {count}")
          open(path, "w", encoding="utf-8", newline="").write(updated)
          PY

          # Verify the replacement landed correctly
          NEW_TAG="$(grep -oP -m1 'pkg:github/clice-io/clice@\Kv0\.1\.[0-9]+' "$FILE" || true)"

          if [ "$NEW_TAG" != "$LATEST_TAG" ]; then
            echo "::error::Replacement failed: expected '$LATEST_TAG', got '$NEW_TAG'"
            exit 1
          fi

          # Commit and push the single changed file
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$FILE"
          git commit -m "feat: update clice"
          git push
